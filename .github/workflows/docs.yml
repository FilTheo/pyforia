name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/pyforia/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/pyforia/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-docs.txt
      - run: mkdocs build --strict
